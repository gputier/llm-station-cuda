  max_tokens: "https://huggingface.co/Kwaipilot/KAT-Coder-V2.5-Dev, README brut, meme exemple (max_tokens=32768), lu le 2026-09-24 ; .superpowers/sdd/2026-09-23-banc-llm-refonte-plan/progress.md, ruling Y"
  preserve_thinking: "https://huggingface.co/Kwaipilot/KAT-Coder-V2.5-Dev, README brut, section Preserve Thinking : \"KAT-Coder-V2.5-Dev has been additionally trained to preserve and leverage thinking traces from historical messages. You can enable this behavior by setting the preserve_thinking option\", chat_template_kwargs={\"preserve_thinking\": True}, lu le 2026-09-24"
# Deviation SOURCEE, corrigee le 24/09/2026 : la premiere version de cette
# fiche prenait le mode instruct de la fiche (enable_thinking: false), ce
# qui enfreint la regle de Guillaume pour cette campagne, "thinking dans
# chaque configuration". La fiche Kwaipilot publie DEUX exemples avec
# exactement les memes cinq valeurs de sampling (temp 0.7, top_p 0.8,
# presence 1.5, top_k 20, max_tokens 32768) : l'un les emploie en mode
# instruct (enable_thinking: false, ecarte), l'autre en mode "Preserve
# Thinking" (chat_template_kwargs={"preserve_thinking": True}, thinking
# actif par defaut, la fiche precise que le modele garde le raisonnement
# des tours precedents au lieu de ne garder que celui du dernier message).
# R2 prend ce second exemple : le sampling differe de R1 (temp 1.0/top_p
# 0.95/max_tokens 81920), le thinking reste actif sur toute la
# configuration, la deviation reste sourcee mot pour mot sur la fiche.
#
# L'issue llama.cpp #27767 (tool_choice non applique avec enable_thinking:
# false) ne s'applique plus a cette configuration puisque le thinking reste
# actif ; elle avait ete testee en direct sur l'ancienne version de cette
# fiche (non reproduite, tool_calls recu normalement) avant cette
# correction.
ctx_proven: null

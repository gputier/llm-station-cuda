machine: "99"
model: bonsai
variant: R3
label: "KV q4_0 et ctx 393216 par override qwen35, rappel à prouver"
exe: 'D:\LLM-Setup\llama-cpp-b10883\llama-server.exe'
workdir: 'D:\LLM-Setup\llama-cpp-b10883'
cudabin: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin'
args:
  - '-m'
  - 'D:\models\ternary-bonsai-27b\Ternary-Bonsai-27B-Q2_g64.gguf'
  - '--mmproj'
  - 'D:\models\ternary-bonsai-27b\Ternary-Bonsai-27B-mmproj-BF16.gguf'
  - '--n-gpu-layers'
  - '99'
  - '--load-mode'
  - 'mlock'
  - '--flash-attn'
  - 'on'
  - '--jinja'
  - '--chat-template-file'
  - 'D:\models\ternary-bonsai-27b\chat-template-system-anywhere.jinja'
  # Clé d'architecture réelle lue le 23/09/2026 dans l'en-tête GGUF de
  # Ternary-Bonsai-27B-Q2_g64.gguf : qwen35 (base dense Qwen3.6-27B).
  # Sans cet override, /props rendait n_ctx=262144 malgré --ctx-size 393216
  # (constat live du 23/09/2026, même piège que documenté pour qwen/tiel).
  - '--override-kv'
  - 'qwen35.context_length=int:393216'
  - '--host'
  - '0.0.0.0'
  - '--port'
  - '8080'
  - '--parallel'
  - '1'
  - '--ctx-size'
  - '393216'
  - '-b'
  - '4096'
  - '-ub'
  - '2048'
  - '--cache-type-k'
  - 'q4_0'
  - '--cache-type-v'
  - 'q4_0'
  - '-cram'
  - '24576'
env: {}
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  max_tokens: 8192
chat_template_kwargs: {}
sources:

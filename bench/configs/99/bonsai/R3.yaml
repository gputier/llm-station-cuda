  top_p: "https://huggingface.co/prism-ml/Ternary-Bonsai-27B-gguf (lu le 2026-09-23)"
  top_k: "https://huggingface.co/prism-ml/Ternary-Bonsai-27B-gguf (lu le 2026-09-23)"
  min_p: "huggingface.co/prism-ml/Ternary-Bonsai-27B-gguf ne publie pas de generation_config.json (404 le 2026-09-24, dépôt GGUF seul) ; défaut transformers GenerationConfig.min_p = None, aucun filtre (configuration_utils.py, lu le 2026-09-24)"
  max_tokens: ".superpowers/sdd/2026-09-23-banc-llm-refonte-plan/progress.md, ruling Y"

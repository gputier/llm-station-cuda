# Deviation SOURCEE, corrigee le 24/09/2026 sur remarque du controleur.
# Premiere version de cette fiche chargeait le fichier de brouillon publie a
# part (mtp-Qwen3.6-35B-A3B-Q4_0.gguf) via --spec-draft-model : rejetee en
# direct, "llama_model_load: error loading model: invalid vector subscript"
# (journal complet garde plus bas pour memoire). Avant d'abandonner la
# speculation, l'en-tete du GGUF PRINCIPAL a ete relu (requete a plage
# d'octets, 30 Mo pour couvrir toute la section des tenseurs sur ce modele a
# 753 tenseurs, aucun modele charge, aucun GPU touche) : le fichier
# principal contient DEJA la tete MTP integree, quatre tenseurs reels
# trouves par leur nom exact :
#   blk.40.nextn.eh_proj.weight [4096, 2048] type 12 (Q4_K)
#   blk.40.nextn.enorm.weight [2048] type 0 (F32)
#   blk.40.nextn.hnorm.weight [2048] type 0 (F32)
#   blk.40.nextn.shared_head_norm.weight [2048] type 0 (F32)
# Meme motif que qwen36 (non-APEX) sur cette meme machine et que kat/qwen
# sur la 99 (bench/configs/99/tiel, bench/configs/99/hemmingway pour la
# forme exacte des drapeaux sur ce moteur b11156) : --spec-type draft-mtp
# seul, SANS --spec-draft-model ni --spec-draft-ngl, la tete embarquee est
# utilisee automatiquement. Le depot separe "mtp-*.gguf" (Q8_0 et Q4_0,
# discussion #1 du depot Abliterated, IsValorum : "j'ai oublie de
# quantifier les fichiers MTP pour tous les modeles V2.1") exporte donc les
# MEMES tenseurs a part, pas une tete manquante : ni le fichier Q4_0 ni un
# autre format externe ne sont necessaires ici. Cache K/V laisse a q8_0
# comme R1 (pas de fichier de brouillon supplementaire a loger, les
# tenseurs nextn sont deja comptes dans les 14,18 Gio du fichier
# principal) : mesure reelle dans docs/phase0-2026-09.md pour la VRAM
# obtenue avec la speculation active.
#
# Risque connu, non corrige ici faute de reproduction locale a ce jour :
# llama.cpp #26425 (MTP retient un etat entre requetes, sortie non
# deterministe, statut ouvert/non confirme au 2026-09-24), lu sur
# github.com/ggml-org/llama.cpp/issues/26425. La tache 14 avait deja
# reproduit l'issue #29295 (echec similaire du cache) sur qwen/R1 sans la
# retrouver (0/5 froid, 0/5 chaud) ; #26425 n'a pas ete rejouee sur cette
# configuration precise, le mandat ne demande pas de reproduction, seulement
# un smoke test reel : si le contrôle de fumee produit un tool_calls
# incoherent ou une erreur, la configuration sera rejetee avec son journal.
#
# Ancien journal de rejet (fichier externe --spec-draft-model, ecarte,
# garde pour memoire) : "common_speculative_init_result: loading draft
# model 'D:\models\qwen36apex\mtp-Qwen3.6-35B-A3B-Q4_0.gguf'" puis
# "llama_model_load: error loading model: invalid vector subscript",
# "failed to load draft model". Lecture desormais confirmee par l'en-tete :
# ce fichier ne contient que les quatre tenseurs nextn ci-dessus, sans
# vocabulaire ni tenseurs d'entree, donc pas un modele autonome que le
# chargeur generique --spec-draft-model puisse ouvrir ; c'est la tete
# embarquee du fichier principal qui doit servir, pas ce fichier a part.

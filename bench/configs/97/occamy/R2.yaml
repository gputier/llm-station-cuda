machine: "97"
model: occamy
variant: R2
label: "sampling precis (sourcee : mitigation de boucle de raisonnement discutee sur la fiche), meme moteur que R1"
exe: 'D:\LLM-Setup\llama-cpp-b11156\llama-server.exe'
workdir: 'D:\LLM-Setup\llama-cpp-b11156'
cudabin: null
args:
  - '-m'
  - 'D:\models\occamy-nano\Occamy-1.0.APEX-I-NanoPlus.gguf'
  - '--mmproj'
  - 'D:\models\occamy-nano\mmproj-Q8_0.gguf'
  - '--n-gpu-layers'
  - '99'
  - '--flash-attn'
  - 'on'
  - '--jinja'
  - '--chat-template-file'
  - 'D:\models\occamy-nano\chat-template-system-anywhere.jinja'
  - '--host'
  - '0.0.0.0'
  - '--port'
  - '8080'
  - '--parallel'
  - '1'
  - '--ctx-size'
  - '262144'
  - '-b'

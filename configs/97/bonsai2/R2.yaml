workdir: 'D:\LLM-Setup\llama-cpp-prism-bonsai2'
args:
  - '-m'
  - 'D:\models\ternary-bonsai-2-27b\Ternary-Bonsai-2-27B-PTQ1_0.gguf'
  - '--n-gpu-layers'
  - '99'
  - '--flash-attn'
  - 'on'
  - '--jinja'
  - '--chat-template-file'
  - 'D:\models\ternary-bonsai-2-27b\chat-template-system-anywhere.jinja'
  - '--host'
  - '0.0.0.0'
  - '--port'
  - '8080'
  - '--parallel'
  - '1'
  - '--ctx-size'
  - '262144'
  - '-b'
  - '2048'
  - '-ub'
  - '512'
  - '--cache-type-k'
  - 'q8_0'
  - '--cache-type-v'
  - 'q8_0'

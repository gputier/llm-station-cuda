# Packing et carte : arbitrage de Guillaume du 24/09/2026 (docs/phase0-2026-09.md,
# section "Choix de packing bonsai2 R1", Option B) : PTQ1_0 reste le format de
# R1 mais migre sur la 97 (RTX 4080 SUPER, carte Ada), ou la fiche dit
# explicitement que PTQ1_0 decode plus vite ET tient mieux en memoire (5,95 Go
# contre 7,21 Go pour PQ2_0), contrairement a la 99 (Blackwell) ou PTQ1_0 n'est
# qu'un choix de memoire. Fenetre 262144 (source huggingface.co, README,
# section Context & Output : "Context length: 262K tokens", lue le 2026-09-24) :
# mesuree reellement, n_ctx=262144 confirme par /props le 2026-09-24, VRAM
# 15906 Mio sur 16376 (marge de 470 Mio, tres etroite mais tient), appel
# d'outil reel reussi a travers la passerelle du banc (port 8097, une ligne de
# journal, HTTP 200).
#
# Pas de spéculation : le depot source de reference pour l'execution du modele
# (github.com/PrismML-Eng/Bonsai-demo, README, section Speculative Decoding,
# lu le 2026-09-24) dit explicitement "Bonsai 2 27B has no official drafter
# yet; the launcher warns and runs without speculation for that family." Les
# fiches bonsai2 de la 99 chargent un drafter nomme "z-lab" par convention de
# nommage locale, non un drafter officiel du depot source de reference : ce
# mandat ne le reconduit pas sur la 97.
# ctx_proven reste null, comme sur la 99 (docs/phase0-2026-09.md) : ce qui a
# ete mesure est que le serveur accepte et sert la fenetre demandee (/props),
# pas que le modele raisonne correctement a cette profondeur.
ctx_proven: null

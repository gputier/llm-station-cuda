# Base reelle : Kwaipilot/KAT-Coder-V2.5-Dev (confirmee par le README APEX
# et par le champ base_model absent du README APEX mais cite explicitement
# dans le texte ; le README de Kwaipilot lui-meme confirme
# "KAT-Coder-V2.5-Dev natively supports context lengths of up to 262,144
# tokens" et une architecture Qwen3.6-35B-A3B, luu le 2026-09-24).
#
# Comparaison : nos configurations kat existantes (bench/configs/99/kat)
# servent le meme modele de base sur la 99 avec le meme sampling R1

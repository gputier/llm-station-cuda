# Modele ajoute a la station 97 (RTX 4080 SUPER 16 Go, Ada), arbitrage de
# Guillaume du 24/09/2026, collection huggingface.co/collections/IsValorum/
# apex-i-miniplus-v21-current. Depot reel IsValorum/Qwen3.6-35B-A3B-MTP-
# APEX-I-MiniPlus-V2.1-GGUF, fichier principal verifie par l'API
# /api/models/<repo>?blobs=true le 2026-09-24 : 15229762144 octets (identique
# a l'octet pres au mandat), sha256
# afe2de904fa378863e25738bcdb0392ba48b9725b19ca8df738a5005139f3c42. En-tete
# GGUF lu par requete a plage d'octets (aucun modele charge, aucun GPU
# touche) : general.architecture "qwen35moe", meme cle que kat et nex sur la
# 99, reconnue nativement par b11156 (aucun --override-kv necessaire, a la
# difference de nex/bonsai sur la 99 dont la cle reelle differait de celle
# supposee).
#
# Architecture hybride lue dans le meme en-tete : 41 blocs,
# full_attention_interval=4 (donc environ 11 blocs a attention pleine sur
# 41, le reste en couches recurrentes DeltaNet/SSM dont le cout memoire ne
# grandit pas avec le contexte), 2 tetes KV, longueur de cle et de valeur
# 256. Calcul avant mesure : a f16, le cache KV des seules couches a
# attention pleine pese environ 22528 octets par jeton (11 x 2 x 2 x 256 x 2
# octets), soit environ 5,5 Gio a la fenetre pleine de 262144 jetons ; les
# poids du fichier principal pesent a eux seuls 14,18 Gio, ce qui ne laisse
# aucune marge sur une carte de 16 Go meme avec un cache K/V pleinement
# quantifie. C'est cette contrainte, pas une preference esthetique, qui
# impose --cache-type-k/v q8_0 des R1 : c'est aussi le type de cache que la
# fiche APEX recommande elle-meme dans sa commande d'exemple ("La commande
# recommandee CLI"), meme si cette commande cible une carte de 24 Go a une
# fenetre reduite (104960) que ce mandat ne reprend pas telle quelle.
#
# Pas de tete MTP ici : la commande d'exemple de la fiche APEX elle-meme ne
# charge aucune tete MTP (voir R2 pour la tentative de speculation), et R1
# doit rester fidele au sampling et a la recette de base de la fiche, pas a
# une variante optionnelle.
#
# ctx_proven reste null : ce que le contrôle de fumee mesure est que le
# serveur accepte et sert la fenetre demandee (/props), pas que le modele
# raisonne correctement a cette profondeur. La VRAM reelle et la fenetre
# reellement tenue (262144 ou moins, mesure) sont dans
# docs/phase0-2026-09.md.
ctx_proven: null
# The embedded template raises 'System message must be at the beginning'
# on a late system turn, which Claude Code sends mid-session (500 on the
# first turn, reported 2026-09-25 on occamy R2). The file is that template
# with the raising line alone replaced by an ordinary ChatML system turn.
# Moved from the 97 on 2026-09-25: this quant spills out of the 16 GB card
# at 262144 context (about 30 tok/s instead of 130), and every model must
# run fully on its card at that context. Same file, same flags, same engine
# (b11156 is installed on both machines); the 97 now serves a smaller quant.

# Modele ajoute a la station 97, arbitrage de Guillaume du 24/09/2026, meme
# collection que qwen36apex et katapex. Depot IsValorum/Occamy-1.0-APEX-I-
# MiniPlus-V2.1-GGUF, fichier principal verifie 14751300704 octets
# (identique au mandat), sha256
# 5fa88e7a3e7ea4833d6e45bb3dcaf34aa5a8ebaf85cebe3794c4a94f4d4cb303. Le depot
# publie aussi un mmproj (mmproj-Accio-Lab_occamy-1.0-Q8_0.gguf,
# 614194528 octets, sha256
# 17c9213e22ccf9b1b68c64eb7a4abd4ef5166d6164b7d9720d34e06c309fcd82) : c'est
# le seul fichier de projection publie par ce depot, monte sur les trois
# variantes comme le fait deja muse sur la 99, la fiche de base decrivant le
# modele comme "Mixture-of-Experts causal model with vision encoder".
#
# La fiche APEX annonce une integration MTP ("releases receive integrated
# MTP where supported"), mais AUCUNE tete MTP n'est publiee dans ce depot
# (liste de fichiers confirmee par /api/models/<repo>?blobs=true le
# 2026-09-24 : le GGUF principal, le mmproj, le README et .gitattributes
# seulement) : la mention de la fiche ne se traduit pas par un fichier reel
# ici. La fiche de base (Accio-Lab/occamy-1.0) confirme separement qu'une
# "Experimental MTP head" existe comme depot A PART
# (occamy-1.0-MTP), jamais fusionnee dans les poids principaux : aucune
# speculation n'est configuree pour occamy sur cette machine.
#
# En-tete GGUF lu par requete a plage d'octets : general.architecture
# "qwen35moe", 40 blocs, full_attention_interval=4, 2 tetes KV, cle/valeur
# 256, meme famille hybride que les deux autres modeles APEX de ce mandat.
# Base reelle Qwen/Qwen3.6-35B-A3B confirmee par le champ base_model du
# README APEX ET par le README de la fiche Accio-Lab ("Starting Checkpoint:
# Qwen3.6-35B-A3B").
#
# Fait a noter pour l'interpretation de la fenetre : la fiche Accio-Lab
# donne "Base Architecture Context: 262,144 tokens" MAIS aussi "SFT Sequence
# Length: 131,072 tokens" (meme tableau, section 2 Model Summary, lu le
# 2026-09-24) : le modele n'a ete entraine en fin de chaine (SFT, HDPO,
# fusion, SAO) qu'a la moitie de la fenetre architecturale. Servir 262144
# jetons ici mesure ce que le SERVEUR accepte, pas ce que le modele a appris
# a exploiter au-dela de 131072 : a signaler dans docs/phase0-2026-09.md,
# pas seulement dans ce commentaire.
#
# ctx_proven reste null : /props confirme seulement la fenetre servie.
ctx_proven: null
# The embedded template raises 'System message must be at the beginning'
# on a late system turn, which Claude Code sends mid-session (500 on the
# first turn, reported 2026-09-25 on occamy R2). The file is that template
# with the raising line alone replaced by an ordinary ChatML system turn.
# Moved from the 97 on 2026-09-25: this quant spills out of the 16 GB card
# at 262144 context (about 30 tok/s instead of 130), and every model must
# run fully on its card at that context. Same file, same flags, same engine
# (b11156 is installed on both machines); the 97 now serves a smaller quant.

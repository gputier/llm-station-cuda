machine: "99"
model: occamy
variant: R2
label: "sampling precis (sourcee : mitigation de boucle de raisonnement discutee sur la fiche), meme moteur que R1"
exe: 'D:\LLM-Setup\llama-cpp-b11156\llama-server.exe'
workdir: 'D:\LLM-Setup\llama-cpp-b11156'
cudabin: null
args:
  - '-m'
  - 'D:\models\occamy\Occamy-1.0.APEX-I-MiniPlus-V2.1.gguf'
  - '--mmproj'
  - 'D:\models\occamy\mmproj-Accio-Lab_occamy-1.0-Q8_0.gguf'
  - '--n-gpu-layers'
  - '99'
  - '--flash-attn'
  - 'on'
  - '--jinja'
  - '--chat-template-file'
  - 'D:\models\occamy\chat-template-system-anywhere.jinja'
  - '--host'
  - '0.0.0.0'
  - '--port'
  - '8080'
  - '--parallel'
  - '1'
  - '--ctx-size'
  - '262144'
  - '-b'
  - '512'
  - '-ub'
  - '512'
  - '--cache-type-k'
  - 'q8_0'
  - '--cache-type-v'
  - 'q8_0'
env: {}
sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  max_tokens: 32768
chat_template_kwargs:
  enable_thinking: true
  preserve_thinking: true
sources:
  temperature: "https://huggingface.co/Accio-Lab/occamy-1.0/discussions/8 (\"Reasoning Loop\"), lu le 2026-09-24 : un signaleur propose temperature=0.6, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0 comme reglage plus stable contre les boucles de raisonnement observees en R1 ; l'equipe Accio-Lab repond avoir pris note sans fermer le fil (\"We'll look into it and try to fix this behavior in the next version\")"
  top_p: "https://huggingface.co/Accio-Lab/occamy-1.0/discussions/8, meme fil, lu le 2026-09-24"
  top_k: "https://huggingface.co/Accio-Lab/occamy-1.0/discussions/8, meme fil, lu le 2026-09-24"
  min_p: "https://huggingface.co/Accio-Lab/occamy-1.0/discussions/8, meme fil, lu le 2026-09-24"
  presence_penalty: "https://huggingface.co/Accio-Lab/occamy-1.0/discussions/8, meme fil, lu le 2026-09-24"
  max_tokens: ".superpowers/sdd/2026-09-23-banc-llm-refonte-plan/progress.md, ruling Y ; meme valeur que R1, la discussion ne donne pas de max_tokens propre"
  enable_thinking: "https://huggingface.co/Accio-Lab/occamy-1.0, README brut, section 6, meme reglage que R1 : la deviation testee est le sampling, pas le mode de reflexion"
  preserve_thinking: "https://huggingface.co/Accio-Lab/occamy-1.0, README brut, section 6, meme reglage que R1"
# Deviation SOURCEE, mais avec une reserve a lire : ce n'est PAS une
# recommandation d'Accio-Lab, c'est le reglage propose par un utilisateur
# tiers dans une discussion ou l'equipe reconnait le probleme (boucle de
# raisonnement) sans le fermer ni confirmer que ce reglage le resout ; le
# fil ne montre aucune valeur alternative testee par la suite. Note au
# passage : les cinq valeurs citees dans ce fil sont EXACTEMENT celles du
# mode "thinking, taches de codage precises" de la fiche de base
# Qwen/Qwen3.6-35B-A3B (temp=0.6/top_p=0.95/top_k=20/min_p=0.0/
# presence_penalty=0.0), qu'Occamy herite de son point de depart : la
# proposition n'est probablement pas inventee par le signaleur mais reprise
# de la fiche du modele de base, ce qui la rend plus credible qu'une
# suggestion ad hoc.
ctx_proven: null
# The embedded template raises 'System message must be at the beginning'
# on a late system turn, which Claude Code sends mid-session (500 on the
# first turn, reported 2026-09-25 on occamy R2). The file is that template
# with the raising line alone replaced by an ordinary ChatML system turn.
# Moved from the 97 on 2026-09-25: this quant spills out of the 16 GB card
# at 262144 context (about 30 tok/s instead of 130), and every model must
# run fully on its card at that context. Same file, same flags, same engine
# (b11156 is installed on both machines); the 97 now serves a smaller quant.
